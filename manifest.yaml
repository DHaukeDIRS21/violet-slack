# Slack-App-Manifest für Violet (Stand der bestehenden App + channels:history)
# api.slack.com/apps → Violet → App Manifest
display_information:
  name: Violet
  description: Persönlicher Slack-Assistent von Daniel (Focus of the day, #allgemein-Posts, DM-Digest)
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
    agent_tasks_enabled: true
  bot_user:
    display_name: Violet
    always_online: true
oauth_config:
  scopes:
    user:
      - chat:write          # postet als du (Focus, #allgemein, Weiterleitung)
      - search:read
      - im:history          # DM-Digest + Live-DMs
      - im:read
      - mpim:history
      - mpim:read
      - groups:history
      - groups:read
      - channels:history    # Focus-Thread in #improver-squad lesen
      - channels:read
      - users:read
      - files:read          # Bilder aus DMs laden
      - files:write         # Bilder mit nach #dirs21_sysadmin weiterleiten
      - lists:read          # To-do-Liste lesen (Focus-Vorschläge)
      - lists:write         # To-do-Liste anlegen, Einträge abhaken
    bot:
      - chat:write
      - im:history
      - im:write
      - users:read
      - files:write         # Bilder aus DMs im Violet-Chat zeigen
      - canvases:write      # heutiger Focus als Canvas im Violet-Chat
  pkce_enabled: false
settings:
  event_subscriptions:
    user_events:
      - message.im          # neue DMs an dich (Live-Anzeige)
      - message.mpim
      - message.groups      # #monitoring-torz / #monitoring-wernau (privat) → Eskalation
    bot_events:
      - message.im          # deine Befehle an Violet
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false
  is_mcp_enabled: false
